name: CI

# Minimal quality gate for a single-file HTML game with no build step.
# Every push / PR: extract the <script type="module"> from index.html, syntax-check
# it with `node --check`, and run the pure-logic tests. One broken edit to the single
# file otherwise breaks the whole game silently on GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract the module script from index.html
        # `node --check index.html` does NOT work (it's an HTML file). Pull out just the
        # module <script> body, then syntax-check that.
        run: |
          awk '/<script type="module">/{f=1;next} /<\/script>/{if(f){f=0}} f' index.html > /tmp/module.mjs
          test -s /tmp/module.mjs || { echo "::error::extracted module is empty — did the <script type=\"module\"> markers change?"; exit 1; }

      - name: Syntax-check the game module
        run: node --check /tmp/module.mjs

      - name: Syntax-check the service worker
        run: node --check service-worker.js

      # `node --check` proves the module parses; it says nothing about whether the script
      # still matches the markup around it. A renamed or deleted element id sails past the
      # syntax check and kills the game at runtime instead.
      - name: Check every referenced DOM id exists
        run: node tools/check-dom-ids.mjs index.html

      - name: Run logic tests
        run: node tests/logic.test.mjs

      # Three.js is vendored under assets/vendor/three. Re-hash it against the upstream
      # release so a local edit (accidental or otherwise) to a 1.4 MB dependency cannot pass
      # unnoticed. The script skips itself if the network is unavailable.
      - name: Verify the vendored Three.js against upstream
        run: node tools/verify-vendor.mjs 0.160.0 assets/vendor/three
